name: Deploy to Github Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install

      - name: Build docs
        run: bun run build:docs

      - name: Build demos
        run: bun run build:demos

      - name: Build slides
        run: bun run build:slides

      - name: Merge build outputs
        run: |
          for dir in sessions/*/*/demo; do
            if [ -d "$dir/dist" ]; then
              mkdir -p "docs/.vitepress/dist/$dir"
              cp -r "$dir/dist/"* "docs/.vitepress/dist/$dir/"
            fi
          done
          for dir in sessions/*/*/slides; do
            if [ -d "$dir/dist" ]; then
              mkdir -p "docs/.vitepress/dist/$dir"
              cp -r "$dir/dist/"* "docs/.vitepress/dist/$dir/"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
